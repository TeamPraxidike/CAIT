# =============================================================================
# CI/CD Pipeline
# =============================================================================
#
# Two-stage pipeline that gates merges to main:
#   Stage 1 (test):  Unit + integration tests on GH Actions runner
#   Stage 2 (e2e):   Playwright E2E against a real staging deployment
#
# Both stages must pass before a PR can be merged to main.
# Merging to main triggers production deploy via Coolify (existing setup).
#
# REQUIRED BRANCH PROTECTION RULES ON main:
#   - Require status checks for unit-integration and e2e
#   - Require branches to be up to date before merging
# =============================================================================

name: CI Pipeline

on:
  pull_request:
    branches: [main]

# =============================================================================
# WHY NO WORKFLOW-LEVEL CONCURRENCY:
#
# We need different concurrency strategies per job:
#   - unit-integration: cancel-in-progress per PR (fast feedback on new pushes)
#   - e2e:  queue globally (staging is a shared single resource)
#
# Workflow-level concurrency would force one strategy for both.
# =============================================================================

jobs:
  # ===========================================================================
  # STAGE 1: Unit & Integration Tests
  # ===========================================================================
  #
  # Runs Vitest against a local Supabase subset.
  #
  # Concurrency: cancel-in-progress PER PR. If you push again to the same PR
  # while tests are running, the old run is killed immediately. No point
  # finishing tests on stale code.
  # ===========================================================================
  unit-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    concurrency:
      group: test-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    # -------------------------------------------------------------------------
    # maximum amount of time a job or step can run before GitHub automatically cancels it 
    # -------------------------------------------------------------------------
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

        # RLIMIT ISSUE temp fix
        # this step is only necessary because of an issue with Docker and Supabase where it cannot set the `ulimit`.
        # this step sets the `ulimit` higher than the Supabase supavisor container's 100000, to prevent an "Operation not permitted"
        # error stopping the supavisor from starting.
        # https://github.com/supabase/cli/issues/4443
      - name: Configure system limits
        run: |
          echo "This is due to a bug with Supabase and GitHub runner: https://github.com/supabase/cli/issues/4443"
          # Set ulimit for system (higher than Supabase's 100000)
          # Run ulimit within a root shell since it's a builtin and cannot be run like `sudo ulimit`
          sudo bash -c 'ulimit -n 200000 && ulimit -u 16384'
          
          # Configure Docker daemon with merged config
          DOCKER_CONFIG="/etc/docker/daemon.json"
          
          # Read existing config or start with empty object
          if [ -f "$DOCKER_CONFIG" ]; then
            EXISTING_CONFIG=$(cat "$DOCKER_CONFIG")
          else
            EXISTING_CONFIG="{}"
          fi
          
          # Merge new limits with existing config using jq (higher than Supabase's 100000)
          echo "$EXISTING_CONFIG" | jq '. + {
            "default-ulimits": {
              "nofile": {
                "Name": "nofile",
                "Hard": 200000,
                "Soft": 200000
              },
              "nproc": {
                "Name": "nproc",
                "Hard": 16384,
                "Soft": 16384
              }
            }
          }' | sudo tee "$DOCKER_CONFIG" > /dev/null
          
          # Restart Docker to apply changes
          sudo systemctl restart docker
          
          # Wait for Docker to be ready
          timeout 30 sh -c 'until docker info > /dev/null 2>&1; do sleep 1; done'


      - uses: actions/setup-node@v4
        # use Node version enforced for the project
        # see https://github.com/actions/setup-node
        with:
          node-version-file: '.nvmrc'
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # load the env variables for the sveltekit app
      # (slightly) different from .env.ci
      - name: Load app env
        run: cat cicd/.env.app.ci >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      - name: Run Unit Tests
        run: npm run test:unit

      - name: Restore Docker Image cache
        if: always()
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: ~/.docker-cache
          key: docker-${{ runner.os }}-${{ hashFiles('cicd/docker-compose.ci.yml') }}
          save-always: true

      - name: Load cached images
        if: always() && steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          for f in ~/.docker-cache/*.tar; do docker load -i "$f"; done

      - name: Run Integration Tests
        if: always()
        run: npm run test:integration

      - name: Save images to cache
        if: steps.docker-cache.outputs.cache-hit != 'true' && always()
        run: |
          mkdir -p ~/.docker-cache
          docker compose -f cicd/docker-compose.ci.yml --env-file cicd/.env.ci config --images | while read img; do
            fname=$(echo "$img" | tr '/:' '__')
            docker save "$img" -o ~/.docker-cache/"$fname".tar
          done


      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: reports/coverage/unit
          retention-days: 7

      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: reports/coverage/integration
          retention-days: 7

      # https://github.com/davelosert/vitest-coverage-report-action
      - name: Report Unit Coverage
        # Set if: always() to also generate the report if tests are failing
        # Only works if you set `reportOnFailure: true` in your vite config as specified above
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Unit
          json-summary-path: reports/coverage/unit/coverage-summary.json
          json-final-path: reports/coverage/unit/coverage-final.json
          vite-config-path: vitest.config.unit.ts

      - name: Report Integration Coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Integration
          json-summary-path: reports/coverage/integration/coverage-summary.json
          json-final-path: reports/coverage/integration/coverage-final.json
          vite-config-path: vitest.config.integration.ts

  e2e:
    # TODO: add a needs: unit-integration section
    name: End-to-End tests with playwright
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    # single group, no concurrent executions
    # due to resource limitations
    concurrency:
      group: staging-test-e2e
      cancel-in-progress: false

    timeout-minutes: 30

    steps:
      # -----------------------------------------------------------------------
      # Check out the merge commit.
      # fetch-depth: 0 is required for the force-push to work.
      # it takes all historical commits instead of just a subset
      # TODO: establish whether this is slow or not
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # use the nvmrc setup to enforce Node version
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Only install Chromium. No need for Firefox/WebKit unless you're
      # doing cross-browser testing (you probably shouldn't be in CI — save
      # that for periodic manual runs). `--with-deps` installs OS-level
      # libraries that Chromium needs on Ubuntu.
      # -----------------------------------------------------------------------
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # -----------------------------------------------------------------------
      # STEP 1: Push PR code to the staging branch.
      #
      # This is the mechanism that gets the PR's code onto the staging VPS.
      # Force-push is safe because:
      #   - `staging` is not a working branch — nobody commits to it directly
      #   - The concurrency lock ensures only one job does this at a time
      #   - We're pushing a specific SHA, so it's deterministic

      # HEAD points to the SHA of the merge commit (temp, exists only for the merge session)
      # -----------------------------------------------------------------------
      - name: Update staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:refs/heads/staging

      # -----------------------------------------------------------------------
      # STEP 2: Stop both applications so we deploy fresh
      # -----------------------------------------------------------------------
      - name: Stop both applications
        run: bash scripts/cicd/stop-and-wait.sh
        env:
          COOLIFY_URL: ${{ secrets.STAGING_COOLIFY_BASE_URL }}
          TOKEN: ${{ secrets.STAGING_COOLIFY_API_TOKEN }}
          SUPABASE_UUID: ${{ secrets.STAGING_COOLIFY_SUPABASE_UUID }}
          SVELTEKIT_UUID: ${{ secrets.STAGING_COOLIFY_SVELTEKIT_UUID }}

      # -----------------------------------------------------------------------
      # STEP 3: Deploy Supabase and wait for all services to be healthy
      # -----------------------------------------------------------------------
      - name: Deploy and health-check Supabase
        run: bash scripts/cicd/deploy-supabase-to-staging.sh
        env:
          COOLIFY_URL: ${{ secrets.STAGING_COOLIFY_BASE_URL }}
          TOKEN: ${{ secrets.STAGING_COOLIFY_API_TOKEN }}
          SUPABASE_UUID: ${{ secrets.STAGING_COOLIFY_SUPABASE_UUID }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          DASH_USER: ${{ secrets.STAGING_DASHBOARD_USERNAME }}
          DASH_PASS: ${{ secrets.STAGING_DASHBOARD_PASSWORD }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Wipe staging database
        run: |
          echo "Listing containers..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} "docker ps --format '{{.Names}}'"
    
          DB_CONTAINER=$(ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} \
            "docker ps --format '{{.Names}}' | grep '^supabase-db'")
          echo "Found container: $DB_CONTAINER"
    
          ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} \
            "docker exec $DB_CONTAINER psql -U supabase_admin -d postgres -c \"
              DO \\\$\\\$
              DECLARE r RECORD;
              BEGIN
                FOR r IN (SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename != '_prisma_migrations')
                LOOP
                  EXECUTE format('TRUNCATE TABLE public.%I RESTART IDENTITY CASCADE', r.tablename);
                END LOOP;
              END
              \\\$\\\$;
            \""

      # -----------------------------------------------------------------------
      # STEP 4: Deploy SvelteKit and wait for it to be healthy
      # init-db.sh runs on startup (migrations, triggers, RLS, buckets)
      # -----------------------------------------------------------------------
      - name: Deploy and health-check SvelteKit
        run: bash scripts/cicd/deploy-sveltekit-to-staging.sh
        env:
          COOLIFY_URL: ${{ secrets.STAGING_COOLIFY_BASE_URL }}
          TOKEN: ${{ secrets.STAGING_COOLIFY_API_TOKEN }}
          SVELTEKIT_UUID: ${{ secrets.STAGING_COOLIFY_SVELTEKIT_UUID }}
          SVELTEKIT_URL: ${{ secrets.STAGING_URL }}

      # -----------------------------------------------------------------------
      # STEP 5: Run Playwright E2E tests
      # -----------------------------------------------------------------------
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          STAGING_URL: ${{ secrets.STAGING_URL }}

      # -----------------------------------------------------------------------
      # STEP 6: Upload test report (even on failure)
      # -----------------------------------------------------------------------
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
