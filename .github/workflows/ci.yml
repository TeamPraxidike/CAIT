name: CI Pipeline

on:
  pull_request:
    # TODO: change this if necessary, cicd branch currently has this on main
    branches: [staging]

jobs:
  e2e:
    name: End-to-End tests with playwright
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    # single group, no concurrent executions
    # due to resource limitations
    concurrency:
      group: staging-test-e2e
      cancel-in-progress: false

    timeout-minutes: 30

    steps:
      # -----------------------------------------------------------------------
      # Check out the merge commit.
      # fetch-depth: 0 is required for the force-push to work.
      # it takes all historical commits instead of just a subset
      # TODO: establish whether this is slow or not
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # use the nvmrc setup to enforce Node version
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Only install Chromium. No need for Firefox/WebKit unless you're
      # doing cross-browser testing (you probably shouldn't be in CI — save
      # that for periodic manual runs). `--with-deps` installs OS-level
      # libraries that Chromium needs on Ubuntu.
      # -----------------------------------------------------------------------
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # -----------------------------------------------------------------------
      # STEP 1: Push PR code to the staging branch.
      #
      # This is the mechanism that gets the PR's code onto the staging VPS.
      # Force-push is safe because:
      #   - `staging` is not a working branch — nobody commits to it directly
      #   - The concurrency lock ensures only one job does this at a time
      #   - We're pushing a specific SHA, so it's deterministic

      # HEAD points to the SHA of the merge commit (temp, exists only for the merge session)
      # -----------------------------------------------------------------------
      - name: Update staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:refs/heads/staging
      
