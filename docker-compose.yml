version: '3.9'

services:
  db-test:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5434:5432'
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
    driver: local
