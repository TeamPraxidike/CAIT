# =============================================================================
# CI/CD Pipeline
# =============================================================================
#
# Two-stage pipeline that gates merges to main:
#   Stage 1 (test):  Unit + integration tests on GH Actions runner
#   Stage 2 (e2e):   Playwright E2E against a real staging deployment
#
# Both stages must pass before a PR can be merged to main.
# Merging to main triggers production deploy via Coolify (existing setup).
#
# REQUIRED GITHUB SECRETS:
#   STAGING_COOLIFY_API_TOKEN  - Coolify API bearer token (deploy-scoped)
#   STAGING_COOLIFY_APP_UUID   - UUID of the staging application in Coolify
#   STAGING_COOLIFY_BASE_URL   - Coolify instance URL (e.g. https://coolify.staging.example.com)
#   STAGING_URL                - Public staging app URL (e.g. https://staging.example.com)
#   STAGING_SUPABASE_URL       - Staging Supabase API URL
#   STAGING_SERVICE_ROLE_KEY   - Staging Supabase service_role key
#   STAGING_SSH_HOST           - Staging VPS IP or hostname
#   STAGING_SSH_USER           - SSH user on staging VPS
#   STAGING_SSH_KEY            - Private SSH key for staging VPS access
#   STAGING_DB_CONNECTION      - Prisma connection string for staging DB
#                                (used by the reset script over SSH)
#
# REQUIRED BRANCH PROTECTION RULES ON main:
#   - Require status checks: "Unit & Integration Tests" and "Staging E2E"
#   - Require branches to be up to date before merging
# =============================================================================

name: CI Pipeline

on:
  pull_request:
    branches: [main]

# =============================================================================
# WHY NO WORKFLOW-LEVEL CONCURRENCY:
#
# We need different concurrency strategies per job:
#   - test: cancel-in-progress per PR (fast feedback on new pushes)
#   - e2e:  queue globally (staging is a shared single resource)
#
# Workflow-level concurrency would force one strategy for both.
# =============================================================================

jobs:
  # ===========================================================================
  # STAGE 1: Unit & Integration Tests
  # ===========================================================================
  #
  # Runs Vitest against a local Supabase subset (Postgres + Auth + Storage).
  # This catches logic errors, query bugs, and auth/storage integration issues
  # without needing a full deployment.
  #
  # Concurrency: cancel-in-progress PER PR. If you push again to the same PR
  # while tests are running, the old run is killed immediately. No point
  # finishing tests on stale code.
  # ===========================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    concurrency:
      group: test-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    # -------------------------------------------------------------------------
    # maximum amount of time a job or step can run before GitHub automatically cancels it 
    # -------------------------------------------------------------------------
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        # QUESTION - why 20? shouldn't we use 22 or 24 (as per project settings)
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Start only the Supabase services we actually need for tests.
      # docker-compose.ci.yml is a stripped-down version of the production
      # compose — see that file for details on what's included and why.
      #
      # We use hardcoded JWT secrets in the CI compose file. These are
      # throwaway values that only exist for the ~5 minutes of the test run
      # on an ephemeral GH Actions runner. No need to store them as secrets.
      # -----------------------------------------------------------------------
      - name: Start Supabase services
        run: docker compose -f docker-compose.ci.yml up -d

      # -----------------------------------------------------------------------
      # QUESTION ABOUT THIS WHOLE SECTION - can I do it better (more concise?)
      # Wait for actual readiness, not just container status.
      #
      # docker-compose "healthy" status is often unreliable because:
      #   1. Healthcheck intervals are too generous by default
      #   2. Kong might be "healthy" but GoTrue behind it isn't ready
      #   3. PostgREST might accept connections before it's loaded the schema
      #
      # We poll the actual endpoints our app will use. If any service doesn't
      # become ready within 60 seconds, fail fast — don't waste 10 minutes
      # running tests that will all fail anyway.
      # -----------------------------------------------------------------------
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.ci.yml exec -T db \
              pg_isready -U postgres -d postgres > /dev/null 2>&1; then
              echo "  Postgres is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "  ERROR: Postgres failed to become ready within 60s"
              docker compose -f docker-compose.ci.yml logs db
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for GoTrue (Auth)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9999/health > /dev/null 2>&1; then
              echo "  GoTrue is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "  ERROR: GoTrue failed to become ready within 60s"
              docker compose -f docker-compose.ci.yml logs auth
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for Storage API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/status > /dev/null 2>&1; then
              echo "  Storage is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "  ERROR: Storage failed to become ready within 60s"
              docker compose -f docker-compose.ci.yml logs storage
              exit 1
            fi
            sleep 2
          done

          echo "Waiting for Kong (API Gateway)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "  Kong is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "  ERROR: Kong failed to become ready within 60s"
              docker compose -f docker-compose.ci.yml logs kong
              exit 1
            fi
            sleep 2
          done

          echo "All services are ready."

      # -----------------------------------------------------------------------
      # QUESTION: WE HAVE OUR OWN SCRITPS FOR THAT in scripts/
      # Run Prisma migrations to set up the schema. We use `migrate deploy`
      # (not `migrate dev`) because this is CI — we don't want Prisma
      # generating new migrations, just applying existing ones.
      # -----------------------------------------------------------------------
      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # -----------------------------------------------------------------------
      # QUESTION: That does not exist, could be created
      # Seed test data. This uses your prisma/seed.ts (or seed.js).
      # If your integration tests seed their own data per-test, you can
      # remove this step — but having a baseline seed is useful for tests
      # that assume certain reference data exists (roles, config, etc).
      # -----------------------------------------------------------------------
      - name: Seed test data
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # -----------------------------------------------------------------------
      # QUESTION: Need to see if the current suite is runnable via this command
      # Run the actual tests. Environment variables point at the local
      # Supabase services. Adjust these to match your app's expected env vars.
      #
      # NOTE: SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY here use the
      # hardcoded JWTs from docker-compose.ci.yml. They're the standard
      # Supabase development JWTs — the same ones you get from `supabase init`.
      # -----------------------------------------------------------------------
      - name: Run Vitest
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SUPABASE_URL: http://localhost:8000
          # ---------------------------------------------------------------------------
          # QUESTION: Regardless, these could be secrets
          # These are the default Supabase local dev JWTs. NOT secrets.
          # They correspond to the JWT_SECRET in docker-compose.ci.yml.
          # ---------------------------------------------------------------------------
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"

      # -----------------------------------------------------------------------
      # Always stop containers, even if tests fail. The `-v` flag removes
      # volumes so we don't leak disk space on the runner (matters if you
      # have many CI runs in a day and GH reuses runners).
      # -----------------------------------------------------------------------
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # ===========================================================================
  # STAGE 2: Staging E2E Tests
  # ===========================================================================
  #
  # Deploys to the real staging environment and runs Playwright against it.
  # This catches deployment issues, environment-specific bugs, and full
  # user-flow regressions that integration tests miss.
  #
  # Concurrency: QUEUE globally (cancel-in-progress: false). Only one
  # deployment + test cycle can run at a time because there's a single
  # staging instance. At ~10 PRs/month, queue depth will almost never
  # exceed 1. If you later find queuing annoying, flip to true — but
  # understand that means one dev's E2E run can be killed by another's push.
  #
  # HOW STAGING DEPLOYMENT WORKS:
  #   1. Force-push PR branch HEAD to a `staging` branch in the repo
  #   2. Trigger Coolify deploy via API (Coolify app tracks `staging` branch)
  #   3. Poll staging URL health endpoint until deployment is live
  #   4. SSH into VPS to wipe + reseed the database
  #   5. Run Playwright against the staging URL
  #
  # WHY FORCE-PUSH TO A STAGING BRANCH:
  #   Coolify applications are configured to deploy a specific branch. We
  #   can't dynamically tell Coolify "deploy this arbitrary PR branch."
  #   Instead, we maintain a `staging` branch that always contains whatever
  #   code we want deployed to staging. Force-pushing is safe here because
  #   `staging` is not a branch anyone works on — it's purely a deployment
  #   target. The concurrency lock ensures only one job writes to it at a time.
  # ===========================================================================
  e2e:
    name: Staging E2E
    needs: test
    runs-on: ubuntu-latest

    concurrency:
      group: staging-e2e
      cancel-in-progress: false

    timeout-minutes: 15

    # -------------------------------------------------------------------------
    # Explicit permissions. We need `contents: write` to force-push to
    # the staging branch. `statuses: write` to report check results.
    # Keep permissions minimal — principle of least privilege.
    # -------------------------------------------------------------------------
    permissions:
      contents: write
      statuses: write

    steps:
      # -----------------------------------------------------------------------
      # QUESTION: IS this correct?
      # Check out the PR HEAD (not the merge commit). We want to deploy
      # exactly the code in the PR, not a speculative merge with main.
      # fetch-depth: 0 is required for the force-push to work.
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # QUESTION: Again, why use node 20?
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Only install Chromium. No need for Firefox/WebKit unless you're
      # doing cross-browser testing (you probably shouldn't be in CI — save
      # that for periodic manual runs). `--with-deps` installs OS-level
      # libraries that Chromium needs on Ubuntu.
      # -----------------------------------------------------------------------
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # -----------------------------------------------------------------------
      # STEP 1: Push PR code to the staging branch.
      #
      # This is the mechanism that gets the PR's code onto the staging VPS.
      # Force-push is safe because:
      #   - `staging` is not a working branch — nobody commits to it directly
      #   - The concurrency lock ensures only one job does this at a time
      #   - We're pushing a specific SHA, so it's deterministic
      # -----------------------------------------------------------------------
      - name: Update staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:refs/heads/staging

      # -----------------------------------------------------------------------
      # STEP 2: Trigger Coolify deployment.
      #
      # IMPORTANT: You need to configure the Coolify staging application to
      # track the `staging` branch. Do this once in the Coolify UI:
      #   Application Settings → Git Repository → Branch: staging
      #
      # The API endpoint may differ by Coolify version. This is for Coolify v4.
      # Check your Coolify docs if this doesn't match your setup.
      #
      # We capture the HTTP status code to distinguish between "deploy
      # triggered" (200) and "something went wrong" (4xx/5xx).
      # -----------------------------------------------------------------------
      - name: Trigger Coolify deployment
        id: deploy
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/coolify-response.json -w "%{http_code}" \
            -X POST \
            "${{ secrets.STAGING_COOLIFY_BASE_URL }}/api/v1/applications/${{ secrets.STAGING_COOLIFY_APP_UUID }}/restart" \
            -H "Authorization: Bearer ${{ secrets.STAGING_COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json")

          echo "Coolify API responded with HTTP $HTTP_STATUS"
          cat /tmp/coolify-response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Coolify deployment trigger failed"
            exit 1
          fi

          echo "Deployment triggered successfully"

      # -----------------------------------------------------------------------
      # STEP 3: Wait for the deployment to be live.
      #
      # We poll the staging URL's health endpoint. This is more reliable than
      # checking Coolify's deployment status API because:
      #   - It tests what actually matters (is the app serving traffic?)
      #   - It catches cases where Coolify says "deployed" but the app crashed
      #   - It's simpler and works regardless of Coolify version
      #
      # Strategy:
      #   - Initial 30s sleep: deployment takes time to even start. Polling
      #     immediately wastes requests and clutters logs.
      #   - Then poll every 10s for up to 4 minutes.
      #   - On failure: dump what we know and exit. Don't leave the job
      #     hanging until the 15-minute timeout.
      #
      # ADJUST the health endpoint path to match your app. Common options:
      #   /api/health, /healthz, /api/v1/health, or just /
      # The endpoint should return 200 when the app is ready to serve.
      # -----------------------------------------------------------------------
      - name: Wait for staging deployment
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"
          HEALTH_ENDPOINT="${STAGING_URL}/api/health"

          echo "Waiting 30s for deployment to start..."
          sleep 30

          echo "Polling ${HEALTH_ENDPOINT}..."
          for i in $(seq 1 24); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_ENDPOINT" || echo "000")
            echo "  Attempt $i/24: HTTP $HTTP_STATUS"

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Staging is live and healthy."
              exit 0
            fi

            sleep 10
          done

          echo "ERROR: Staging did not become healthy within 4 minutes."
          echo "Last response from ${HEALTH_ENDPOINT}: HTTP $HTTP_STATUS"
          exit 1

      # -----------------------------------------------------------------------
      # STEP 4: Wipe and reseed the staging database.
      #
      # This runs BEFORE Playwright, making it a precondition of the test
      # run rather than a postcondition of the previous one. This is
      # deliberate — see the guide for the full rationale.
      #
      # The script runs via SSH on the staging VPS. It:
      #   1. Connects to the staging database
      #   2. Drops all data (truncate with cascade)
      #   3. Runs the seed script
      #
      # WHY SSH AND NOT A REMOTE PRISMA COMMAND:
      #   Running `prisma migrate reset` from the GH Actions runner would
      #   require the staging database port to be exposed to the internet.
      #   SSH is more secure — the database stays behind the firewall.
      # -----------------------------------------------------------------------
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Reset and seed staging database
        run: |
          ssh -i ~/.ssh/staging_key \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            'bash -s' < ./scripts/reset-staging-db.sh

      # -----------------------------------------------------------------------
      # STEP 5: Run Playwright against the live staging environment.
      #
      # BASE_URL is injected as an env var and used in playwright.config.ts.
      # The Supabase service role key is available for per-test data setup
      # and cleanup via the Supabase admin client.
      #
      # We only run Chromium. Cross-browser testing could be used in the future
      # -----------------------------------------------------------------------
      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}

      # -----------------------------------------------------------------------
      # Always upload the Playwright HTML report
      # -----------------------------------------------------------------------
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # -----------------------------------------------------------------------
      # Clean up SSH key from the runner.
      # -----------------------------------------------------------------------
      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh/staging_key
